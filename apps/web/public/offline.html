<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Server nicht erreichbar – PK-Scan</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        background: #030712;
        color: #e5e7eb;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }

      main {
        max-width: 22rem;
      }

      .mark {
        display: inline-flex;
        width: 64px;
        height: 64px;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        border: 1px solid #1f2937;
        border-radius: 18px;
        background: #0b1220;
        color: #38bdf8;
        font-size: 30px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 14px;
        font-size: 15px;
        line-height: 1.5;
        color: #9ca3af;
      }

      code {
        display: inline-block;
        max-width: 100%;
        padding: 3px 8px;
        overflow-wrap: anywhere;
        border: 1px solid #1f2937;
        border-radius: 8px;
        background: #0b1220;
        font-size: 13px;
        color: #cbd5e1;
      }

      button {
        margin-top: 6px;
        padding: 10px 18px;
        border: 0;
        border-radius: 12px;
        background: #0284c7;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⚡</div>
      <h1 id="title">Server nicht erreichbar</h1>
      <p id="hint">
        Die App lädt die Karten von deinem Scanner-Server. Prüfe WLAN, die Adresse und – bei eigener
        CA – das vertrauenswürdige Zertifikat.
      </p>
      <p id="address" hidden><code></code></p>
      <button id="retry" type="button" hidden>Erneut versuchen</button>
    </main>

    <script>
      // Wird beim iOS-Build durch die konfigurierte Server-Adresse ersetzt
      // (scripts/generate-ios-assets.mjs). Bleibt der Platzhalter stehen, zeigt
      // die Seite nur den allgemeinen Hinweis.
      (function () {
        var serverUrl = "__PCS_APP_URL__";
        var hasUrl = serverUrl.indexOf("https://") === 0;

        if (!(navigator.language || "").toLowerCase().startsWith("de")) {
          document.documentElement.lang = "en";
          document.getElementById("title").textContent = "Server not reachable";
          document.getElementById("hint").textContent =
            "The app loads the cards from your scanner server. Check Wi-Fi, the address, and (with a private CA) the trusted certificate.";
          document.getElementById("retry").textContent = "Try again";
        }

        if (hasUrl) {
          var address = document.getElementById("address");
          address.querySelector("code").textContent = serverUrl;
          address.hidden = false;

          var retry = document.getElementById("retry");
          retry.hidden = false;
          retry.addEventListener("click", function () {
            window.location.replace(serverUrl);
          });
        }
      })();
    </script>
  </body>
</html>
